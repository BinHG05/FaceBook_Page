services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fbstream-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong(!)Passw0rd"
    ports:
      - "1433:1433"

  kafka:
    image: confluentinc/cp-kafka:7.9.6
    container_name: fbstream-kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:9092 1 40"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.6
    container_name: fbstream-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"

  kafka-rest-proxy:
    image: confluentinc/cp-kafka-rest:7.9.6
    container_name: fbstream-kafka-rest-proxy
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: "kafka-rest-proxy"
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082"
      KAFKA_REST_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      KAFKA_REST_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fbstream-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "fbstream-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: fbstream-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:latest
    container_name: fbstream-prometheus
    depends_on:
      kafka-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: fbstream-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  alert-webhook:
    image: python:3.12-alpine
    container_name: fbstream-alert-webhook
    working_dir: /app
    command: ["python", "/app/server.py"]
    volumes:
      - ./monitoring/alert-webhook:/app:ro
    ports:
      - "18080:8080"

  webhook-service:
    build:
      context: .
      dockerfile: FbStream.WebhookService/Dockerfile
    container_name: fbstream-webhook-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-rest-proxy:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__RestProxyBaseUrl: "http://kafka-rest-proxy:8082"
      Kafka__TopicName: "raw_events"
      FacebookWebhook__VerifyToken: "fbstream-dev-token"
      FacebookWebhook__AppSecret: ""
      FacebookWebhook__PageId: "1029208276949641"
      FacebookWebhook__AcceptUnsignedPayloads: "true"
    ports:
      - "3001:8080"

  core-service:
    build:
      context: .
      dockerfile: FbStream.CoreService/Dockerfile
    container_name: fbstream-core-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-rest-proxy:
        condition: service_started
      sqlserver:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__GroupId: "core-service-docker-group"
      Kafka__RestProxyBaseUrl: "http://kafka-rest-proxy:8082"
      Kafka__RawEventsTopic: "raw_events"
      Kafka__ReplyCommandsTopic: "reply_commands"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FbStreamDb;User Id=sa;Password=YourStrong(!)Passw0rd;TrustServerCertificate=True;"
      Ai__Model: "gemini-3.8-flash-lite"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "3002:8080"

  backend-api:
    build:
      context: .
      dockerfile: FbStream.BackendApi/Dockerfile
    container_name: fbstream-backend-api
    depends_on:
      kafka:
        condition: service_healthy
      kafka-rest-proxy:
        condition: service_started
      sqlserver:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__GroupId: "backend-api-docker-group"
      Kafka__RestProxyBaseUrl: "http://kafka-rest-proxy:8082"
      Kafka__ReplyCommandsTopic: "reply_commands"
      Kafka__SendRetryTopic: "send_retry"
      Kafka__SendFailedTopic: "send_failed"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FbStreamDb;User Id=sa;Password=YourStrong(!)Passw0rd;TrustServerCertificate=True;"
      FacebookGraph__BaseUrl: "https://graph.facebook.com/v25.0"
      FacebookGraph__PageId: "1029208276949641"
      FacebookGraph__PageAccessToken: "${FACEBOOK_PAGE_ACCESS_TOKEN}"
      FacebookGraph__SimulateMode: "false"
      AdminAuth__ApiKey: "${ADMIN_API_KEY}"
    ports:
      - "3000:8080"

  retry-service:
    build:
      context: .
      dockerfile: FbStream.RetryService/Dockerfile
    container_name: fbstream-retry-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-rest-proxy:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__GroupId: "retry-service-docker-group"
      Kafka__RestProxyBaseUrl: "http://kafka-rest-proxy:8082"
      Kafka__SendFailedTopic: "send_failed"
      Kafka__SendRetryTopic: "send_retry"
      Kafka__DeadLetterTopic: "dead_letter"
      Kafka__MaxRetryCount: "3"
    ports:
      - "3003:8080"

  analytics-dashboard:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    container_name: fbstream-analytics-dashboard
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_GROUP_ID: "analytics-stream-processor-group"
      METRICS_DB_PATH: "/app/data/metrics.db"
    volumes:
      - analytics_data:/app/data
    ports:
      - "8501:8501"

volumes:
  analytics_data:
